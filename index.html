<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대구대공원 스마트 분양지도</title>
  
  <!-- 1. 카카오 지도 API 호출 (보안 통신 https 강제 적용 및 키 연동) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e16c213b532d9339f0d3e9ae1167caa2"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; display: flex; height: 100vh; overflow: hidden; background: #f8fafc; }
    
    /* 사이드바 레이아웃 */
    #sidebar { width: 450px; height: 100%; background: #ffffff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
    .header { padding: 25px 20px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
    .header h1 { font-size: 1.3rem; color: #1e3a8a; margin-bottom: 8px; font-weight: 800; }
    .header p { font-size: 0.9rem; color: #64748b; line-height: 1.5; }
    
    /* 상세 정보 패널 */
    #content { padding: 20px; overflow-y: auto; flex: 1; }
    .info-card { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 10px; padding: 18px; margin-bottom: 20px; }
    .info-card h3 { font-size: 1.15rem; color: #0f172a; margin-bottom: 10px; font-weight: 700; }
    .info-card p { font-size: 0.9rem; color: #334155; margin-bottom: 6px; line-height: 1.4; }
    .badge-cat { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; background: #e0e7ff; color: #3730a3; margin-bottom: 10px; }
    
    /* 표 디자인 */
    .table-wrap { margin-top: 15px; }
    .table-wrap h4 { font-size: 1rem; color: #1e293b; margin-bottom: 12px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; background: #ffffff; }
    th, td { padding: 10px 8px; border: 1px solid #e2e8f0; text-align: center; }
    th { background: #f8fafc; color: #475569; font-weight: 700; }
    
    /* 분양 상태 뱃지 */
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
    .status-contracted { background: #fee2e2; color: #991b1b; }
    .status-available { background: #dcfce7; color: #166534; }
    .status-progress { background: #fef3c7; color: #92400e; }
    
    /* 로딩 및 안내 문구 */
    .placeholder-text { text-align: center; color: #94a3b8; font-size: 1rem; margin-top: 120px; font-weight: 600; }
    
    /* 지도 영역 */
    #map { flex: 1; height: 100%; position: relative; }
  </style>
</head>
<body>
  
  <!-- 좌측 사이드바 -->
  <div id="sidebar">
    <div class="header">
      <h1>대구대공원 스마트 분양지도</h1>
      <p>지도의 마커를 클릭하시면 입지 상세 정보와 실시간 단지별 분양 현황이 표시됩니다.</p>
    </div>
    <div id="content">
      <div id="detail-panel" class="placeholder-text">
        📍 지도에서 원하시는 핀을 클릭해주세요.
      </div>
    </div>
  </div>
  
  <!-- 우측 카카오 지도 -->
  <div id="map"></div>

  <script>
    // 2. 구글 시트 웹 앱 URL (사용자님 데이터 연동)
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyKahFADbkqYNlFAHfxpgHkFM_-3Ks3aMECbijHOMcdoO7a7X6VKO6ECIHYbFsM9cLoJg/exec";

    let map;
    let globalLocations = [];
    let globalSales = [];

    // 3. 지도 초기화 함수 (카카오맵 엔진)
    function initMap() {
      const container = document.getElementById('map');
      
      // 대구대공원 중심 좌표
      const daeguParkCoord = new kakao.maps.LatLng(35.8249666, 128.6672119);
      
      const options = {
        center: daeguParkCoord,
        level: 5 // 확대 수준 (값이 작을수록 확대됨)
      };

      // 지도 생성
      map = new kakao.maps.Map(container, options);

      // 우측 상단 컨트롤러 추가
      const mapTypeControl = new kakao.maps.MapTypeControl();
      map.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPRIGHT);
      const zoomControl = new kakao.maps.ZoomControl();
      map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

      // 반경 1km 가이드 원 그리기
      new kakao.maps.Circle({
        map: map,
        center: daeguParkCoord,
        radius: 1000, // 1km
        strokeWeight: 2,
        strokeColor: '#2563eb',
        strokeOpacity: 0.9,
        strokeStyle: 'dashed',
        fillColor: '#3b82f6',
        fillOpacity: 0.1
      });

      // 데이터 불러오기 실행
      fetchSheetData();
    }

    // 4. 구글 시트 데이터 호출 함수
    function fetchSheetData() {
      const panel = document.getElementById('detail-panel');
      panel.innerHTML = "⏳ 실시간 분양 데이터를 동기화하는 중입니다...";

      fetch(GAS_API_URL)
        .then(response => {
          if (!response.ok) throw new Error('네트워크 응답이 정상이 아닙니다.');
          return response.json();
        })
        .then(data => {
          globalLocations = data.locations || [];
          globalSales = data.sales || [];
          renderMarkers();
          panel.innerHTML = "📍 지도에서 원하시는 핀을 클릭해주세요.";
        })
        .catch(error => {
          console.error("Fetch 에러:", error);
          panel.innerHTML = "❌ 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
        });
    }

    // 5. 마커 렌더링 함수
    function renderMarkers() {
      globalLocations.forEach(loc => {
        // 좌표 유효성 검사
        if(!loc.lat || !loc.lng) return;

        const markerPosition = new kakao.maps.LatLng(loc.lat, loc.lng);
        
        const marker = new kakao.maps.Marker({
          position: markerPosition,
          title: loc.name,
          map: map
        });

        // 마커 클릭 이벤트
        kakao.maps.event.addListener(marker, 'click', function() {
          showLocationDetail(loc);
          // 클릭 시 마커 중앙으로 이동
          map.panTo(markerPosition);
        });
      });
    }

    // 6. 사이드바 상세 정보 출력 함수
    function showLocationDetail(loc) {
      const panel = document.getElementById('detail-panel');
      
      let html = `
        <div class="info-card">
          <span class="badge-cat">${loc.category || '정보없음'}</span>
          <h3>${loc.name || '알 수 없음'}</h3>
          <p><strong>위치 좌표:</strong> ${parseFloat(loc.lat).toFixed(5)}, ${parseFloat(loc.lng).toFixed(5)}</p>
          <p><strong>상세 설명:</strong> ${loc.desc || '설명이 없습니다.'}</p>
        </div>
      `;

      // 사업지이거나 이름에 '공동주택'이 포함된 경우에만 분양 현황 표 출력
      if (loc.category === "사업지" || (loc.name && loc.name.includes("공동주택"))) {
        html += `
          <div class="table-wrap">
            <h4>📋 단지별 실시간 분양 현황</h4>
            <table>
              <thead>
                <tr>
                  <th>단지명</th>
                  <th>동</th>
                  <th>호수</th>
                  <th>타입</th>
                  <th>상태</th>
                </tr>
              </thead>
              <tbody>
        `;

        let hasSalesData = false;

        globalSales.forEach(s => {
          if (!s.complex) return; // 빈 데이터 패스
          
          hasSalesData = true;
          let badgeClass = 'status-progress';
          if (s.status === '계약완료') badgeClass = 'status-contracted';
          if (s.status === '미분양') badgeClass = 'status-available';

          html += `
            <tr>
              <td>${s.complex}</td>
              <td>${s.dong}동</td>
              <td>${s.ho}호</td>
              <td>${s.type}</td>
              <td><span class="status-badge ${badgeClass}">${s.status || '-'}</span></td>
            </tr>
          `;
        });

        if (!hasSalesData) {
          html += `<tr><td colspan="5">현재 등록된 분양 데이터가 없습니다.</td></tr>`;
        }

        html += `</tbody></table></div>`;
      }

      panel.innerHTML = html;
    }

    // 페이지 로드 완료 시 지도 초기화
    window.onload = function() {
      initMap();
    };
  </script>
</body>
</html>
