<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대구대공원 AI 스마트 분양지도</title>
  <!-- 카카오 지도 API 호출 (사용자님 키 적용 완료) -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=e16c213b532d9339f0d3e9ae1167caa2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; background: #f8fafc; }
    #sidebar { width: 440px; height: 100%; background: #ffffff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
    .header { padding: 22px 20px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
    .header h1 { font-size: 1.25rem; color: #1e3a8a; margin-bottom: 6px; font-weight: 700; }
    .header p { font-size: 0.85rem; color: #64748b; line-height: 1.4; }
    #content { padding: 20px; overflow-y: auto; flex: 1; }
    #map { flex: 1; height: 100%; }
    .info-card { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    .info-card h3 { font-size: 1.1rem; color: #0f172a; margin-bottom: 8px; }
    .info-card p { font-size: 0.9rem; color: #334155; margin-bottom: 4px; }
    .badge-cat { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; background: #e0e7ff; color: #3730a3; margin-bottom: 8px; }
    .table-wrap { margin-top: 15px; }
    .table-wrap h4 { font-size: 0.95rem; color: #1e293b; margin-bottom: 10px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { padding: 9px 8px; border: 1px solid #e2e8f0; text-align: center; }
    th { background: #f8fafc; color: #475569; font-weight: 600; }
    .status-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .status-contracted { background: #fee2e2; color: #991b1b; }
    .status-available { background: #dcfce7; color: #166534; }
    .status-progress { background: #fef3c7; color: #92400e; }
    .placeholder-text { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-top: 100px; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="header">
      <h1>대구대공원 스마트 분양지도</h1>
      <p>지도의 핀을 클릭하면 입지 상세 정보와 세부 분양 현황이 표시됩니다.</p>
    </div>
    <div id="content">
      <div id="detail-panel" class="placeholder-text">
        📍 지도에서 핀을 클릭해주세요.
      </div>
    </div>
  </div>
  <div id="map"></div>

  <script>
    let map;
    let globalLocations = [];
    let globalSales = [];

    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyKahFADbkqYNlFAHfxpgHkFM_-3Ks3aMECbijHOMcdoO7a7X6VKO6ECIHYbFsM9cLoJg/exec";

    function initMap() {
      const container = document.getElementById('map');
      const daeguParkCoord = new kakao.maps.LatLng(35.8249666, 128.6672119);
      
      const options = {
        center: daeguParkCoord,
        level: 5
      };

      // 카카오 지도 객체 생성
      map = new kakao.maps.Map(container, options);

      // 지도 컨트롤러 등록
      const mapTypeControl = new kakao.maps.MapTypeControl();
      map.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPRIGHT);
      const zoomControl = new kakao.maps.ZoomControl();
      map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

      // 반경 1km 원형 오버레이 등록
      new kakao.maps.Circle({
        map: map,
        center: daeguParkCoord,
        radius: 1000,
        strokeWeight: 2,
        strokeColor: '#2563eb',
        strokeOpacity: 0.8,
        strokeStyle: 'dashed',
        fillColor: '#3b82f6',
        fillOpacity: 0.12
      });

      fetchSheetData();
    }

    function fetchSheetData() {
      document.getElementById('detail-panel').innerHTML = "⏳ 구글 시트 데이터를 동기화하는 중입니다...";

      fetch(GAS_API_URL)
        .then(res => res.json())
        .then(data => {
          globalLocations = data.locations;
          globalSales = data.sales;
          renderMarkers();
          document.getElementById('detail-panel').innerHTML = "📍 지도에서 핀을 클릭해주세요.";
        })
        .catch(err => {
          document.getElementById('detail-panel').innerHTML = "❌ 데이터 동기화 오류: " + err;
        });
    }

    function renderMarkers() {
      globalLocations.forEach(loc => {
        const markerPosition = new kakao.maps.LatLng(loc.lat, loc.lng);
        const marker = new kakao.maps.Marker({
          position: markerPosition,
          title: loc.name
        });

        marker.setMap(map);

        kakao.maps.event.addListener(marker, 'click', function() {
          showLocationDetail(loc);
        });
      });
    }

    function showLocationDetail(loc) {
      let html = `
        <div class="info-card">
          <span class="badge-cat">${loc.category}</span>
          <h3>${loc.name}</h3>
          <p><strong>위치 좌표:</strong> ${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}</p>
          <p><strong>상세 설명:</strong> ${loc.desc}</p>
        </div>
      `;

      if (loc.category === "사업지" || loc.name.includes("공동주택")) {
        html += `
          <div class="table-wrap">
            <h4>📋 단지별 실시간 분양 현황</h4>
            <table>
              <thead>
                <tr>
                  <th>단지명</th>
                  <th>동</th>
                  <th>호수</th>
                  <th>타입</th>
                  <th>분양상태</th>
                </tr>
              </thead>
              <tbody>
        `;

        globalSales.forEach(s => {
          let badgeClass = 'status-progress';
          if (s.status === '계약완료') badgeClass = 'status-contracted';
          if (s.status === '미분양') badgeClass = 'status-available';

          html += `
            <tr>
              <td>${s.complex}</td>
              <td>${s.dong}동</td>
              <td>${s.ho}호</td>
              <td>${s.type}</td>
              <td><span class="status-badge ${badgeClass}">${s.status}</span></td>
            </tr>
          `;
        });

        html += `</tbody></table></div>`;
      }

      document.getElementById('detail-panel').innerHTML = html;
    }

    window.onload = initMap;
  </script>
</body>
</html>
